services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  xml-service:
    build: ./xml-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  processor:
    build: ./processor
    env_file: .env
    depends_on:
      - xml-service
    ports:
      - "8089:8089"

  crawler:
    build: ./crawler
    env_file: .env
    depends_on:
      - processor

  bi-service:
    build: ./bi-service
    env_file: .env
    depends_on:
      - xml-service
    ports:
      - "8000:8000"

  xmlrpc-service:
    build: ./xmlrpc-service
    env_file: .env
    depends_on:
      - xml-service
    ports:
      - "9001:9001"

  grpc-service:
    build: ./grpc-service
    env_file: .env
    depends_on:
      - xml-service
    ports:
      - "50051:50051"

  viewer-service:
    build: ./viewer-service
    depends_on:
      - bi-service
    environment:
      BI_SERVICE_URL: http://bi-service:8000
      VIEWER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
